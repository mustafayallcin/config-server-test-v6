application.elasticsearch.enabled:
  configValueCount: "SINGLE"
  configValueType: "BOOLEAN"
  displayName: "Elasticsearch Enabled"
  description: "Enables or disables Elasticsearch indexing and search features"
  sectionName: "ELASTICSEARCH_ENABLED"
  encrypted: false
  rule: null
  restartRequired: true
  defaultValue: false
application.elasticsearch.real-time.reindex-cron:
  configValueCount: "SINGLE"
  configValueType: "STRING"
  displayName: "Elasticsearch Real-Time Reindex Cron Expression"
  description: "Cron expression controlling the real-time reindex polling interval"
  sectionName: "ELASTICSEARCH_REALTIME_REINDEX_CRON"
  encrypted: false
  rule: null
  restartRequired: false
  defaultValue: "0 */30 * ? * *"
