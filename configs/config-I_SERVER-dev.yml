      lite-member:
        cluster-members: "iserver"
        instance-port-padding: 5701
      native-client:
        password: "{cipher}81c28330f23022100e15ead892cfc1c95b1dd77cf9a107ab4bc02640fd597553"
        url: "localhost:5701"
        username: "{cipher}82feb40c73f4c0d9f319f953c4355552f30081a440d3bf57029bdff8ecfc847a"
  providers:
    alcatel-enabled: false
    cc-enabled: false
    genesys-enabled: false
    sisphone-enabled: true
  socket-timeout-duration-in-seconds: 5
eureka:
